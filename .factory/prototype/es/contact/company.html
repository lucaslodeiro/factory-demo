<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contacto | OpenXpand</title>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<header><div class="nav-shell"><a class="brand" href="/es/home.html"><img src="/assets/logo.svg" width="170" height="39" alt="OpenXpand"/></a></div></header>
<main id="main">
<section class="page-heading"><div class="wrap"><h1>Contactanos</h1></div></section>
<section class="wrap contact-grid">
<div class="contact-panel">
<fieldset class="profile-step">
<legend>¿Cómo te acercás a OpenXpand?</legend>
<div class="profile-options">
<label><input type="radio" name="profile"/> <span><strong>Desarrollador</strong> — busco acceder a las APIs de Open Gateway.</span></label>
<label><input type="radio" name="profile" checked/> <span><strong>Empresa</strong> — busco acceder a las APIs para mi organización.</span></label>
<label><input type="radio" name="profile"/> <span><strong>Telco</strong> — busco la plataforma Open Gateway para mi red.</span></label>
</div>
</fieldset>
<div class="field industry-field"><label for="industry">Rubro de la empresa</label>
<select id="industry"><option value="">Seleccioná un rubro</option><option>Fintech</option><option>Salud</option><option>Retail</option><option>Logística</option><option>Medios</option><option>Seguros</option><option>Utilities</option><option>Gobierno</option><option>Otro</option></select>
</div>
<div class="field"><label for="name">Nombre</label><input id="name" type="text"/></div>
<div class="field"><label for="email">Email</label><input id="email" type="email"/></div>
<div class="field"><label for="company">Empresa</label><input id="company" type="text"/></div>
<div class="field"><label for="api">API de interés <span class="small">(opcional)</span></label><select id="api"><option>Sin preferencia</option><option>SIM Swap</option></select></div>
<div class="field"><label for="message">Mensaje</label><textarea id="message" rows="4"></textarea></div>
<div class="security-box">Verificación de seguridad (Turnstile)</div>
<button class="button" type="button">Enviar solicitud ↗</button>
</div>
</section>
</main>
</body>
</html>
