<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Iniciar sesión | OpenXpand</title>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<header><div class="nav-shell"><a class="brand" href="/es/home.html"><img src="/assets/logo.svg" width="170" height="39" alt="OpenXpand"/></a></div></header>
<main class="auth-page" id="main">
<div class="auth-card">
<img class="brand-mark" src="/assets/logo.svg" width="170" height="39" alt="OpenXpand"/>
<h1>Iniciar sesión</h1>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username"/></div>
<div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password"/></div>
<button class="button peach" type="button">Continuar</button>
<p class="auth-footer">¿No tenés cuenta? <a href="/es/app/signup.html">Registrarse</a></p>
<p class="auth-legal"><a href="/es/home.html">Aviso de privacidad</a></p>
</div>
</main>
</body>
</html>
