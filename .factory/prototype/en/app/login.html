<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Log in | OpenXpand</title>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<header><div class="nav-shell"><a class="brand" href="/en/home.html"><img src="/assets/logo.svg" width="170" height="39" alt="OpenXpand"/></a></div></header>
<main class="auth-page" id="main">
<div class="auth-card">
<img class="brand-mark" src="/assets/logo.svg" width="170" height="39" alt="OpenXpand"/>
<h1>Log in to your account</h1>
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"/></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"/></div>
<button class="button peach" type="button">Continue</button>
<p class="auth-footer">Don't have an account? <a href="/en/app/signup.html">Sign up</a></p>
<p class="auth-legal"><a href="/en/home.html">Privacy notice</a></p>
</div>
</main>
</body>
</html>
